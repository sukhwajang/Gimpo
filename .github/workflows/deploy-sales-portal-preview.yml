name: Deploy sales-portal static preview to Cloudflare Pages

# 영업포탈의 "정적 미리보기"를 Cloudflare Pages 에 올린다.
# 실제 앱을 빌드·실행해 역할별 화면을 HTML 로 저장한 조회 전용 버전이다 (서버·DB 없음).
# 기존 CLOUDFLARE_API_TOKEN (Cloudflare Pages · Edit) 권한만으로 배포된다.

on:
  push:
    branches: [main, claude/amazing-meitner-2tqys8]
    paths: ['sales-portal/**', '.github/workflows/deploy-sales-portal-preview.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sales-portal-preview
  cancel-in-progress: true

defaults:
  run:
    working-directory: sales-portal

env:
  WRANGLER_SEND_METRICS: 'false'
  PROJECT: sales-portal-preview
  TZ: Asia/Seoul

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sales-portal/package-lock.json
      - run: npm ci
      - name: 브라우저 준비 (화면 저장용)
        # 러너에 설치된 Chrome 을 그대로 쓴다 (브라우저 내려받기 없음)
        run: |
          npm install --no-save playwright
          google-chrome --version
      - name: 앱 빌드 (시드 데이터 포함)
        run: npm run build
      - name: 정적 미리보기 생성
        run: PREVIEW_BROWSER_CHANNEL=chrome node scripts/static-preview.cjs
      - name: Cloudflare Pages 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret 이 없습니다."
            exit 1
          fi
          # 계정 ID는 토큰으로 조회한다 (저장소에 남기지 않음)
          CLOUDFLARE_ACCOUNT_ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          export CLOUDFLARE_ACCOUNT_ID
          # 프로젝트가 없으면 만든다 (이미 있으면 오류를 무시)
          npx wrangler pages project create "$PROJECT" --production-branch main || true
          npx wrangler pages deploy preview-out --project-name "$PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-message "static preview" 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          {
            echo "### 영업포탈 정적 미리보기"
            echo "- 주소: https://$PROJECT.pages.dev"
            echo "- 이번 배포: ${URL:-(로그 확인)}"
          } >> "$GITHUB_STEP_SUMMARY"
